name: misbaha_tasbeeh
description: "Misbaha — The Intelligent Dhikr, Adhkar & Qur'an Platform. Offline, Arabic/English, dark mode."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management — ChangeNotifier + provider, minimal and stable.
  provider: ^6.1.2

  # Offline local database (counter sessions, tap events, daily/lifetime stats).
  sqflite: ^2.3.3+1
  path: ^1.9.0
  path_provider: ^2.1.4

  # Persisted user settings (theme, language, sound, vibration, volume-button toggle).
  shared_preferences: ^2.3.2

  # Date formatting for statistics screen.
  intl: ^0.20.2

  # App version display on the About screen. Pinned to ^10.2.1 (bumped from
  # ^8.0.2) because geolocator >=14.0.3 transitively requires
  # package_info_plus ^10.0.0 via geolocator_linux -- see the CI failure
  # this fixed for the exact resolver error.
  package_info_plus: ^10.2.1

  # Offline text-to-speech — drives the device's installed Android
  # TextToSpeech engine/voice packs directly, no network calls.
  flutter_tts: ^4.2.0

  # Wraps TTS playback in a real Android MediaSession: lock-screen controls,
  # notification transport, and a foreground service for background playback.
  audio_service: ^0.18.15

  # "Open TTS settings" deep link so a user missing an Arabic/English voice
  # pack can install one from Android Settings without leaving the app.
  android_intent_plus: ^5.2.0

  # Opens mailto:/https: links from the About screen (contact, privacy, terms).
  url_launcher: ^6.3.1

  # Streams/plays real Qari recitation audio (Qur'an) and caches each played
  # file locally so playback works offline afterward — unlike Adhkar's TTS,
  # Qur'an recitation must be genuine reciter audio, not synthesized speech.
  just_audio: ^0.9.42

  # Keeps the screen awake during Tahajjud Mode's hands-free auto-scroll
  # recitation, without requiring the user to touch the screen.
  wakelock_plus: ^1.2.8

  # Device magnetometer heading + GPS location for the Qiblah compass --
  # see core/services/qiblah_service.dart and features/qiblah/.
  flutter_compass: ^0.8.1
  geolocator: ^14.0.3

  # Prayer-time astronomical calculations (Fajr/sunrise/Dhuhr/Asr/Maghrib/
  # Isha), a Dart port of the well-known open-source batoulapps Adhan
  # library (MIT licensed, no runtime dependencies, pure calculation --
  # no network calls, so prayer times work fully offline once a location
  # fix is stored). See core/services/prayer_times_service.dart.
  adhan_dart: ^2.0.1

  # Hijri/Gregorian calendar conversion (Umm al-Qura tabular calendar, the
  # same convention used officially in Saudi Arabia), BSD-2-Clause
  # licensed, no runtime dependencies, pure on-device calculation. See
  # core/services/hijri_calendar_service.dart.
  hijri: ^3.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # Generates all mipmap/adaptive launcher icons from assets/icon/*.png — run
  # `dart run flutter_launcher_icons` once after `flutter pub get` (see BUILD.md).
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

  assets:
    - assets/icon/
    - assets/images/
    - assets/quran/
    - assets/hadith/

  fonts:
    - family: AmiriQuran
      fonts:
        - asset: assets/fonts/AmiriQuran-Regular.ttf

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "assets/icon/icon_background.png"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  min_sdk_android: 23
